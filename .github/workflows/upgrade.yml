# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Report available Maven dependency and plugin updates nightly (job summary only; changes nothing).

name: upgrade
on:
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch: {}
jobs:
  upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Report available updates
        id: report_available_updates
        run: |-
          set -o pipefail
          npx projen upgrade | tee upgrade-report.txt
          {
            echo "## Available Maven updates"
            echo ""
            echo "Apply an update by changing its version in .projenrc.ts and running npx projen."
            echo ""
            echo '```'
            grep -E -- "->" upgrade-report.txt | sed -E "s/^\[INFO\] *//" | sort -u || echo "Everything is up to date."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
