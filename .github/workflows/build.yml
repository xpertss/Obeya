# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Build and test the Maven project on pull requests.

name: build
on:
  pull_request: {}
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: build
        id: build
        run: npx projen@0.103.25 build
  native:
    name: CLI native image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup GraalVM CE
        id: setup_graalvm_ce
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm-community
          native-image-musl: "true"
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Native image toolchain
        id: native_image_toolchain
        run: native-image --version
  spa:
    name: SPA build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Build web/
        id: build_web
        run: |-
          if [ ! -f web/package.json ]; then
            echo "::notice::web/package.json not found; the SPA lands in P6.1"
            exit 0
          fi
          cd web
          npm ci
          npm run build
  integration:
    name: Rocky integration tests
    runs-on:
      - self-hosted
      - linux
      - rhel9
      - podman
    permissions:
      contents: read
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Setup Java
        id: setup_java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check rootless Podman
        id: check_rootless_podman
        run: |-
          podman --version
          test "$(podman info --format '{{.Host.Security.Rootless}}')" = "true"
          test "$(podman info --format '{{.Host.CgroupsVersion}}')" = "v2"
      - name: Integration tests
        id: integration_tests
        run: mvn -B verify
