# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Fail a PR when a projen-generated file has been edited by hand instead of through the projenrc.

name: projen-drift-check
on:
  pull_request: {}
jobs:
  check:
    name: Projen drift check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
      - name: Setup Node
        id: setup_node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        id: install_dependencies
        run: |-
          if [ ! -f package-lock.json ]; then
            echo "::error file=package.json::package-lock.json is not committed. Run npm install, commit package-lock.json, and push."
            exit 1
          fi
          npm ci --ignore-scripts
      - name: Check for projen drift
        id: check_for_projen_drift
        run: |
          set -euo pipefail
          ./node_modules/.bin/projen
          drifted="$(git diff --name-only)"
          if [ -n "$drifted" ]; then
            while IFS= read -r f; do
              echo "::error file=$f::projen-managed file was edited directly; make the change in .projenrc.ts and re-run npx projen"
            done <<< "$drifted"
            if [ -n "$GH_TOKEN" ] && [ -n "$GITHUB_EVENT_PATH" ]; then
              pr_number="$(jq -r ".pull_request.number // empty" "$GITHUB_EVENT_PATH" 2>/dev/null || true)"
              if [ -n "$pr_number" ]; then
                {
                  echo "❌ projen drift detected"
                  echo ""
                  echo "These files are managed by projen and were edited directly. Direct edits are silently overwritten by the next npx projen run, so they cannot be merged as-is:"
                  echo ""
                  while IFS= read -r f; do echo "  - $f"; done <<< "$drifted"
                  echo ""
                  echo "To fix: revert the direct edits above, make the equivalent change in .projenrc.ts, then run npx projen and commit the regenerated output."
                } | gh pr comment "$pr_number" --body-file - || echo "::warning::could not post PR comment (fork PRs get a read-only token)"
              fi
            fi
            exit 1
          fi
