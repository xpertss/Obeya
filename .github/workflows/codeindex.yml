# ~~ Generated by projen. To modify, edit .projenrc.ts and run "npx projen".
# Purpose: Regenerate and commit the code index on push to main.

name: codeindex
on:
  push:
    branches:
      - main
  workflow_dispatch: {}
jobs:
  codeindex:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7
      - name: Set git identity
        id: set_git_identity
        run: |-
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: codeindex
        id: codeindex
        run: npx projen@0.103.25 codeindex
      - name: Commit code index
        id: commit_code_index
        uses: xpertss/auto-commit@v0.0.4
        with:
          commit_message: "chore: update code index"
          folder: .xss
          if_behind: skip
concurrency:
  group: codeindex
  cancel-in-progress: true
